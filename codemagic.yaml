workflows:
  android-workflow:
    name: AI Drishti Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Ensure Android v2 project files exist
        script: |
          flutter create --platforms=android --org com.example.aidrishti .
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
