workflows:
  ai-drishti-android:
    name: AI Drishti Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Extract Flutter project
        script: |
          set -e
          unzip -o "AI_Drishti_Flutter_Starter (4).zip" -d .
          cd ai_drishti_starter

          # Generate the Android platform files without replacing lib/main.dart.
          flutter create --platforms=android --project-name ai_drishti .

          # This starter ZIP does not include tests. Remove any generated
          # default test that refers to a different app class.
          rm -f test/widget_test.dart

          flutter pub get

      - name: Analyze Flutter project
        script: |
          set -e
          cd ai_drishti_starter
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        script: |
          set -e
          cd ai_drishti_starter
          flutter build apk --release

    artifacts:
      - ai_drishti_starter/build/app/outputs/flutter-apk/app-release.apk
