
workflows:
  ai-drishti-android:
    name: AI Drishti Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Extract Flutter project
        script: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name 'AI_Drishti_Flutter_Starter*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Flutter ZIP file not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .

      - name: Prepare Android project
        script: |
          set -e
          cd ai_drishti_starter
          flutter create --platforms=android .

      - name: Install dependencies
        script: |
          cd ai_drishti_starter
          flutter pub get

      - name: Analyze project
        script: |
          cd ai_drishti_starter
          flutter analyze

      - name: Build release APK
        script: |
          cd ai_drishti_starter
          flutter build apk --release

    artifacts:
      - ai_drishti_starter/build/app/outputs/flutter-apk/*.apk
