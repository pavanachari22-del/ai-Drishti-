workflows:
  android-workflow:
    name: AI Drishti Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android v2 files
        script: |
          flutter create --platforms=android --org com.example.aidrishti .
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
