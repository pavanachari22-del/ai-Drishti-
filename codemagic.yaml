workflows:
  android-workflow:
    name: AI Drishti Android Build
    environment:
      flutter: stable
    scripts:
      - name: Extract Flutter Project
        script: |
          set -e
          ZIP_FILE=$(find . -iname 'AI_Drishti_Flutter_Starter*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Generate Android Platform
        script: |
          set -e
          cd extracted/ai_drishti_starter
          rm -rf android
          flutter create --platforms=android .
          flutter clean
          flutter pub get

      - name: Build Android APK
        script: |
          set -e
          cd extracted/ai_drishti_starter
          flutter build apk --release

    artifacts:
      - extracted/ai_drishti_starter/build/app/outputs/flutter-apk/*.apk
